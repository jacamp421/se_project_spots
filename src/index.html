<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Website with pictures" />
    <meta name="author" content="John Campoverde" />
    <meta name="keywords" content="Pictures,Image-sharing" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body class="body">
    <div class="page">
      <header class="header">
        <img
          src="<%= require('./images/logo.svg') %>"
          alt="Spots logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                src="<%= require('./images/white__pencil.svg') %>"
                alt="Pencil icon"
                class="profile__white-pencil"
              />
            </button>
            <img
              src="<%= require ('./images/avatar.jpg') %>"
              alt="Img of Bessie Coleman"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%= require ('./images/pencil.svg') %>"
                alt="Pencil Icon"
                class="profile__pencil"
              />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
              src="<%= require ('./images/plus.svg') %>"
              alt="Plus Icon"
              class="profile__plus"
            />New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-btn" type="button"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">2025 &copy; John Campoverde - Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <div class="modal__header">
            <h2 class="modal__title">Edit profile</h2>
            <button
              type="button"
              class="modal__close-btn"
              aria-label="Close modal"
            ></button>
          </div>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label"
              >Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <div class="modal__header">
            <h2 class="modal__title">New Post</h2>
            <button
              type="button"
              class="modal__close-btn"
              aria-label="Close modal"
            ></button>
          </div>
          <form class="modal__form" novalidate>
            <label for="new-link-input" class="modal__label"
              >Image link
              <input
                id="new-link-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="new-link-input-error" class="modal__error"></span>
            </label>
            <label for="new-caption-input" class="modal__label"
              >Caption
              <input
                id="new-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30"
              />
              <span id="new-caption-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
    </div>
    <div class="modal" id="preview-modal">
      <div class="modal__image-container">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
        ></button>
        <img src="#" alt="" class="modal__image" />
        <p class="modal__caption"></p>
      </div>
    </div>

    <div class="modal" id="profile-avatar-modal">
      <div class="modal__container">
        <div class="modal__header">
          <h2 class="modal__title">Edit profile avatar</h2>
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          ></button>
        </div>
        <form class="modal__form" novalidate>
          <label for="profile-avatar-input" class="modal__label"
            >Profile Picture
            <input
              id="profile-avatar-input"
              type="url"
              class="modal__input"
              placeholder="Paste link to an image"
              required
              name="avatar"
            />
            <span id="profile-avatar-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>

    <!-- Style the modal -->
    <div class="modal modal__delete-modal" id="delete-modal">
      <div class="modal__container modal__delete-container">
        <div class="modal__header modal__delete-header">
          <h2 class="modal__title modal__delete-title">
            Are you sure you want to delete this image?
          </h2>
          <button
            type="button"
            class="modal__close-btn modal__delete-close-btn"
            aria-label="Close modal"
          ></button>
        </div>
        <form class="modal__form modal__delete-form" novalidate>
          <button type="submit" class="modal__submit-btn modal__delete-comfirm">
            Delete
          </button>
          <button type="Button" class="modal__submit-btn modal__delete-cancel">
            Cancel
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
